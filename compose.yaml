services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: estateai
      POSTGRES_USER: estateai
      POSTGRES_PASSWORD: estateai
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U estateai"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - estateai-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ESTATEAI_DATABASE_URL: postgresql+psycopg://estateai:estateai@database:5432/estateai
      ESTATEAI_CORS_ORIGINS: http://localhost:3002,http://127.0.0.1:3002
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "8002:8002"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      API_URL: http://api:8002/api
      NEXT_PUBLIC_API_URL: http://localhost:8002/api
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3002"

volumes:
  estateai-data:
